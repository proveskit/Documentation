<title id="t">FC Jumpers corner of the antenna board</title>
<desc id="d">The outer face of the antenna board near one corner. A silkscreen box labelled FC Jumpers holds three pairs of plated holes: RESET, BOOT SELECT and WDT DISABLE. A bent paper clip bridges the two BOOT SELECT holes. A second clip touches the RESET pair.</desc>
