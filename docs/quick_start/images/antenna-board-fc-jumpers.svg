<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 236" width="1220" height="472" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">FC Jumpers corner of the antenna board</title>
<desc id="d">The outer face of the antenna board near one corner. A silkscreen box labelled FC Jumpers holds three pairs of plated holes: RESET, BOOT SELECT and WDT DISABLE. A bent paper clip bridges the two BOOT SELECT holes. A second clip touches the RESET pair. The Batt Charging Bypass holes beside them are crossed out: they are wired to the battery and must not be touched.</desc>
